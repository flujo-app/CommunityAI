name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  run-tests:
    env:
      # hf-xet's native downloader has crashed under forked tests on hosted Apple Silicon.
      # The milestone gate intentionally exercises ordinary HTTP Range downloads anyway.
      HF_HUB_DISABLE_XET: "1"
    strategy:
      matrix:
        # Linux guards the broad offline surface; macOS additionally closes the native manifest,
        # identity, artifact-resume, and exact-parity gate required by revival milestone 3.
        include:
          - { os: 'ubuntu', python-version: '3.12' }
          - { os: 'macos', python-version: '3.12' }
      fail-fast: false
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: |
          uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Test
        run: |
          set -x  # Print executed commands
          source .venv/bin/activate  # so bare `python`/`pytest` below use the uv env

          # Offline-only test suite.
          #
          # Free-tier runners have ~2 vCPUs, which cannot sustain a live inference swarm: the
          # upstream suite launched multiple servers (some running a --throughput auto benchmark),
          # starved the CPU, and the client tests retried for many minutes and effectively hung.
          # The tests below are offline synthetic checks -- no live DHT, model download, or
          # external network. The node gates additionally use a loopback-only HTTP listener and
          # short isolated sleeper/crash subprocesses. They still finish quickly and guard the
          # parts of this fork most likely to regress (KV cache, paged cache, per-arch blocks,
          # attention wiring, join tokens, device portability). The catalog publication test
          # also builds the same synthetic bundle twice and requires byte-identical output. The swarm/network tests
          # (test_full_model, test_remote_sequential, ...) require MODEL_NAME/INITIAL_PEERS and a
          # running swarm; the maintainer exercises those on real hardware.
          python -m pytest -v --durations=0 --durations-min=1.0 \
            tests/test_attn_implementation.py \
            tests/test_api_keys.py \
            tests/test_cache.py \
            tests/test_catalog_bootstrap.py \
            tests/test_catalog_publication.py \
            desktop/tests/test_build_desktop.py \
            desktop/tests/test_startup.py \
            tests/test_deepseek_v3.py \
            tests/test_discovery.py \
            tests/test_edge_benchmark.py \
            tests/test_external_qualification.py \
            tests/test_device_portability.py \
            tests/test_gemma4_block.py \
            tests/test_gemma4_multimodal_loading.py \
            tests/test_gemma4_unified.py \
            tests/test_inference_recovery.py \
            tests/test_join_token.py \
            tests/test_kv_cache_strategy.py \
            tests/test_loading_diagnostics.py \
            tests/test_model_catalog.py \
            tests/test_model_manager.py \
            tests/test_model_manifest.py \
            tests/test_multi_machine_qualification.py \
            tests/test_native_credentials.py \
            tests/test_node_config.py \
            tests/test_node.py \
            tests/test_openai_api.py \
            tests/test_official_openai_client.py \
            tests/test_paged_cache.py \
            tests/test_priority_pool.py \
            tests/test_process_lifetime.py \
            tests/test_protocol_identity.py \
            tests/test_qualification_harness.py \
            tests/test_qualification_matrix.py \
            tests/test_qualification_cost_guard.py \
            tests/test_qualification_image_contract.py \
            tests/test_qwen3_5_block.py \
            tests/test_qwen3_5_multimodal_loading.py \
            tests/test_route_health.py \
            tests/test_server_registry.py \
            tests/test_startup_guard.py \
            tests/test_tied_embeddings_from_pretrained.py \
            tests/test_worker_supervisor.py

      - name: Test Linux public-worker control contracts
        if: matrix.os != 'macos'
        run: |
          source .venv/bin/activate
          # Atomic config exchange and shared admission are Windows/Linux public-alpha contracts.
          # The production desktop workflow separately exercises the packaged Windows node.
          # macOS remains outside the supported release matrix.
          python -m pytest -v --durations=0 --durations-min=1.0 \
            tests/test_policy_store.py \
            tests/test_server_admission.py

      - name: Generate pinned TinyLlama manifest (macOS gate)
        if: matrix.os == 'macos'
        run: |
          source .venv/bin/activate
          drift manifest generate Maykeye/TinyLLama-v0 \
            --revision main \
            --alias tinyllama \
            --dtype float32 \
            --attention_implementation eager \
            --output "$RUNNER_TEMP/tinyllama-manifest.json"

      - name: Validate real Hub Range resume (macOS gate)
        if: matrix.os == 'macos'
        run: |
          source .venv/bin/activate
          python scripts/validate_manifest_resume.py "$RUNNER_TEMP/tinyllama-manifest.json"

      - name: Run signed manifested exact-parity swarm (macOS gate)
        if: matrix.os == 'macos'
        run: |
          source .venv/bin/activate
          python scripts/smoke_manifest_local_swarm.py \
            --device cpu \
            --torch-dtype float32 \
            --model-manifest "$RUNNER_TEMP/tinyllama-manifest.json" \
            --timeout 300
