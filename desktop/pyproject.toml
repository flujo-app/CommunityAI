[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "communityai-desktop"
version = "0.1.0"
description = "CommunityAI desktop client for the standalone local inference node"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "keyring>=25,<27",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.11,<7",
]

[project.scripts]
communityai-desktop = "communityai_desktop.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
communityai_desktop = ["assets/*.ico"]

[tool.black]
line-length = 120
required-version = "22.3.0"

[tool.isort]
profile = "black"
line_length = 120
